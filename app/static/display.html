<!doctype html>
<html lang="tr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVR Ekran</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; cursor: none; font: 13px system-ui, "Segoe UI", sans-serif; }
  .screen { position: absolute; inset: 0; display: grid; gap: 2px; background: #000; transition: opacity .4s; }
  .screen.pending { opacity: 0; pointer-events: none; }
  .tile { position: relative; background: #111; overflow: hidden; }
  .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; background: #000; }
  .tile .status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; color: #999; font-size: 13px; }
  .tile .status[hidden] { display: none; }
  .tile .label { position: absolute; left: 0; bottom: 0; padding: 2px 8px; background: rgba(0,0,0,.55); font-size: 12px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.empty { background: #1a1a1a; }
  #hud { position: absolute; top: 6px; right: 8px; z-index: 10; padding: 2px 8px; background: rgba(0,0,0,.55); border-radius: 4px; font-size: 12px; }
  #alarms { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(160, 20, 20, .92); color: #fff; font-size: 15px; padding: 6px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #alarms b { margin-right: 10px; }
  #logo { position: absolute; right: 16px; bottom: 16px; z-index: 15; pointer-events: none; object-fit: contain; max-width: 30vw; transition: bottom .3s; }
  body.alarm #logo { bottom: 44px; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #aaa; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div id="msg">Yükleniyor…</div>
<div id="hud" hidden></div>
<div id="alarms" hidden></div>
<img id="logo" alt="" hidden>
<script src="/static/display.js"></script>
</body>
</html>
