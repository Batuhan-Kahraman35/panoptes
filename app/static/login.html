<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş · DVR Ekran</title>
<link rel="icon" href="/logo">
<style>
  :root {
    --bg: #f4f5f7; --panel: #fff; --text: #1d2330; --muted: #6b7385; --line: #e2e5eb;
    --accent: #2563eb; --accent-text: #fff; --bad: #b91c1c; --bad-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #8d95a6; --line: #2b313d;
      --accent: #3b82f6; --bad: #f87171; --bad-bg: #3a1717;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .logo { display: block; max-height: 64px; max-width: 200px; margin: 0 auto 16px; object-fit: contain; }
  p.muted { color: var(--muted); margin: 0 0 20px; }
  label { display: block; margin-bottom: 14px; }
  label span { display: block; margin-bottom: 4px; color: var(--muted); }
  input { font: inherit; width: 100%; padding: 9px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; width: 100%; padding: 10px; border-radius: 6px; border: 0; background: var(--accent); color: var(--accent-text); font-weight: 600; cursor: pointer; margin-top: 6px; }
  .error { background: var(--bad-bg); color: var(--bad); padding: 8px 10px; border-radius: 6px; margin-bottom: 14px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <img class="logo" src="/logo" alt="" onerror="this.remove()">
  <h1>DVR Ekran Yönetimi</h1>
  <p class="muted">Devam etmek için giriş yapın.</p>
  <div class="error" id="error" hidden></div>
  <input type="hidden" name="next" id="next" value="/">
  <label><span>Kullanıcı adı</span>
    <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
  <label><span>Şifre</span>
    <input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Giriş yap</button>
</form>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("next").value = q.get("next") || "/";
  const messages = { hatali: "Kullanıcı adı veya şifre hatalı.", kilitli: "Çok fazla hatalı deneme. 10 dakika sonra tekrar deneyin." };
  const err = messages[q.get("hata")];
  if (err) Object.assign(document.getElementById("error"), { textContent: err, hidden: false });
</script>
</body>
</html>
